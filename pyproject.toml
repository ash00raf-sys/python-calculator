[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-calculator"
version = "0.1.0"
description = "A small, safe arithmetic-expression calculator library."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=22,<24",
]
license = { text = "MIT" }
authors = [{ name = "python-calculator contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_calculator = ["templates/*.html", "static/*.css", "static/*.js"]
